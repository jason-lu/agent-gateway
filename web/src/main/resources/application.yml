server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: agent-web
  # The DataSource is defined by PostgresConfig (only when agent.store=postgres).
  # Excluding auto-configuration keeps agent.store=memory from ever touching a database.
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
  flyway:
    enabled: true
    schemas: agent
    create-schemas: true
    default-schema: agent
    locations: classpath:db/migration

llm:
  base-url: ${LLM_BASE_URL:${BASE_URL:}}
  api-key: ${LLM_API_KEY:${API_KEY:}}
  model: ${LLM_MODEL:${MODEL:}}
  # Whole seconds a stream may stay silent before it is aborted (0 disables).
  idle-timeout-seconds: ${LLM_IDLE_TIMEOUT:90}

agent:
  metrics:
    # Shared secret for the Prometheus scrape (X-Scrape-Token header or
    # Authorization: Bearer). Unset keeps /actuator/prometheus behind the ADMIN
    # login like every other actuator endpoint.
    scrape-token: ${AGENT_METRICS_TOKEN:}
  store: ${AGENT_STORE:postgres}
  files:
    # Downloadable tool artifacts (/api/v1/files/**). store=local (default)
    # serves from dir; store=oss proxies reads from the Aliyun OSS bucket the
    # office-mcp server uploads to (same prefix). In local mode dir must match
    # the office-mcp server's OFFICE_OUTPUT_DIR.
    store: ${OFFICE_STORE:local}
    dir: ${AGENT_FILES_DIR:output/office}
    oss:
      endpoint: ${OSS_ENDPOINT:}
      bucket: ${OSS_BUCKET:}
      prefix: ${OSS_PREFIX:office/}
      access-key-id: ${OSS_ACCESS_KEY_ID:}
      access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
  db:
    url: ${AGENT_DB_URL:}
    username: ${AGENT_DB_USERNAME:postgres}
    password: ${AGENT_DB_PASSWORD:}
  memory:
    enabled: ${AGENT_MEMORY_ENABLED:true}
    max-messages: ${AGENT_MEMORY_MAX_MESSAGES:20}
    keep-messages: ${AGENT_MEMORY_KEEP_MESSAGES:8}
    max-summary-chars: ${AGENT_MEMORY_MAX_SUMMARY_CHARS:4000}
    instruction: ${AGENT_MEMORY_INSTRUCTION:}
    summary-provider: ${AGENT_MEMORY_SUMMARY_PROVIDER:}
    summary-model: ${AGENT_MEMORY_SUMMARY_MODEL:}
  tools:
    exec:
      # Allows the model to run system commands through the exec tool.
      enabled: ${AGENT_EXEC_ENABLED:true}
      timeout-seconds: ${AGENT_EXEC_TIMEOUT:60}
      output-limit: ${AGENT_EXEC_OUTPUT_LIMIT:8000}
      workdir: ${AGENT_EXEC_WORKDIR:}
    mcp:
      # MCP client: servers come from mcp.json (primary) plus the inline override list.
      enabled: ${AGENT_MCP_ENABLED:true}
      config: ${AGENT_MCP_CONFIG:./mcp.json}
      default-timeout-seconds: ${AGENT_MCP_TIMEOUT:60}
      output-limit: ${AGENT_MCP_OUTPUT_LIMIT:8000}
      refresh-seconds: ${AGENT_MCP_REFRESH:300}
      servers: []
  asr:
    enabled: ${AGENT_ASR_ENABLED:true}
    provider: ${AGENT_ASR_PROVIDER:mimo}
    language: ${AGENT_ASR_LANGUAGE:zh-CN}
    vad-eos-ms: ${AGENT_ASR_VAD_EOS:1000}
    # Xiaomi MiMo ASR (chat.completions + input_audio). The key falls back to the
    # LLM key because both are the same MiMo platform credential by default.
    mimo:
      api-key: ${MIMO_API_KEY:${LLM_API_KEY:}}
      base-url: ${MIMO_BASE_URL:https://api.xiaomimimo.com/v1}
      model: ${MIMO_ASR_MODEL:mimo-v2.5-asr}
    iflytek:
      app-id: ${IFLYTEK_APP_ID:}
      api-key: ${IFLYTEK_API_KEY:}
      api-secret: ${IFLYTEK_API_SECRET:}
  security:
    jwt-secret: ${AGENT_JWT_SECRET:}
    jwt-ttl: ${AGENT_JWT_TTL:2h}
    # A session dies after this long without any authenticated request (idle),
    # regardless of the access-token expiry. Refreshing counts as activity.
    refresh-idle-timeout: ${AGENT_REFRESH_IDLE_TIMEOUT:24h}
    users:
      - username: ${AGENT_ADMIN_USERNAME:admin}
        password: ${AGENT_ADMIN_PASSWORD:change-me}
        roles: [USER, ADMIN]

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus
  metrics:
    tags:
      application: agent-web
    distribution:
      # Quantile gauges for the turn-timing timers/summaries (Grafana-friendly).
      percentiles:
        agent.turn: "0.5, 0.95, 0.99"

logging:
  level:
    root: INFO
