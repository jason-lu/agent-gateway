server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: agent-web
  # The DataSource is defined by PostgresConfig (only when agent.store=postgres).
  # Excluding auto-configuration keeps agent.store=memory from ever touching a database.
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
  flyway:
    enabled: true
    schemas: agent
    create-schemas: true
    default-schema: agent
    locations: classpath:db/migration

llm:
  base-url: ${LLM_BASE_URL:${BASE_URL:}}
  api-key: ${LLM_API_KEY:${API_KEY:}}
  model: ${LLM_MODEL:${MODEL:}}
  # Whole seconds a stream may stay silent before it is aborted (0 disables).
  idle-timeout-seconds: ${LLM_IDLE_TIMEOUT:90}

agent:
  store: ${AGENT_STORE:postgres}
  db:
    url: ${AGENT_DB_URL:}
    username: ${AGENT_DB_USERNAME:postgres}
    password: ${AGENT_DB_PASSWORD:}
  memory:
    enabled: ${AGENT_MEMORY_ENABLED:true}
    max-messages: ${AGENT_MEMORY_MAX_MESSAGES:20}
    keep-messages: ${AGENT_MEMORY_KEEP_MESSAGES:8}
    instruction: ${AGENT_MEMORY_INSTRUCTION:}
  tools:
    exec:
      # Allows the model to run system commands through the exec tool.
      enabled: ${AGENT_EXEC_ENABLED:true}
      timeout-seconds: ${AGENT_EXEC_TIMEOUT:60}
      output-limit: ${AGENT_EXEC_OUTPUT_LIMIT:8000}
      workdir: ${AGENT_EXEC_WORKDIR:}
    mcp:
      # MCP client: servers come from mcp.json (primary) plus the inline override list.
      enabled: ${AGENT_MCP_ENABLED:true}
      config: ${AGENT_MCP_CONFIG:./mcp.json}
      default-timeout-seconds: ${AGENT_MCP_TIMEOUT:60}
      output-limit: ${AGENT_MCP_OUTPUT_LIMIT:8000}
      refresh-seconds: ${AGENT_MCP_REFRESH:300}
      servers: []
  security:
    jwt-secret: ${AGENT_JWT_SECRET:}
    jwt-ttl: ${AGENT_JWT_TTL:2h}
    # A session dies after this long without any authenticated request (idle),
    # regardless of the access-token expiry. Refreshing counts as activity.
    refresh-idle-timeout: ${AGENT_REFRESH_IDLE_TIMEOUT:24h}
    users:
      - username: ${AGENT_ADMIN_USERNAME:admin}
        password: ${AGENT_ADMIN_PASSWORD:change-me}
        roles: [USER, ADMIN]

logging:
  level:
    root: INFO
